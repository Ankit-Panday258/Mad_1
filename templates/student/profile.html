{% extends 'base.html' %}

{% block title %}My Profile - Student{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-7">
        <div class="card border-0 shadow-sm">
            <div class="card-header bg-info text-dark py-3">
                <h5 class="mb-0 fw-bold">My Student Profile</h5>
            </div>
            <div class="card-body p-4">
                <form method="POST">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="username" class="form-label fw-semibold">Username</label>
                            <input type="text" class="form-control" id="username" value="{{ user.username }}" disabled readonly>
                            <div class="form-text">Username cannot be changed.</div>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="email" class="form-label fw-semibold">Email Address</label>
                            <input type="email" class="form-control" id="email" value="{{ user.email }}" disabled readonly>
                            <div class="form-text">Email address is permanently linked.</div>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="full_name" class="form-label fw-semibold">Full Name *</label>
                            <input type="text" class="form-control" id="full_name" name="full_name" value="{{ user.full_name }}" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="roll_no" class="form-label fw-semibold">Roll Number / Student ID *</label>
                            <input type="text" class="form-control" id="roll_no" name="roll_no" value="{{ user.roll_no or '' }}" required>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="department" class="form-label fw-semibold">Department / Program</label>
                            <input type="text" class="form-control" id="department" name="department" value="{{ user.department or '' }}">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="phone" class="form-label fw-semibold">Phone Number</label>
                            <input type="tel" class="form-control" id="phone" name="phone" value="{{ user.phone or '' }}">
                        </div>
                    </div>

                    <hr class="my-3">
                    <h6 class="fw-bold text-secondary mb-3">Change Password (Optional)</h6>
                    <div class="mb-4">
                        <label for="new_password" class="form-label fw-semibold">New Password</label>
                        <input type="password" class="form-control" id="new_password" name="new_password" placeholder="Leave blank to keep current password">
                    </div>

                    <div class="d-flex justify-content-between">
                        <a href="{{ url_for('student_dashboard') }}" class="btn btn-outline-secondary">Cancel</a>
                        <button type="submit" class="btn btn-primary">Update Profile</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
