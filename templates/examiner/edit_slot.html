{% extends 'base.html' %}

{% block title %}Edit Slot - Examiner{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-7">
        <div class="card border-0 shadow-sm">
            <div class="card-header bg-success text-white py-3">
                <h5 class="mb-0 fw-bold">Edit Examination Slot</h5>
            </div>
            <div class="card-body p-4">
                <div class="alert alert-info py-2 small mb-3">
                    Exam: <strong>{{ slot.examination.exam_name }}</strong> ({{ slot.examination.course.course_code }})
                </div>

                <form method="POST">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="date" class="form-label fw-semibold">Slot Date *</label>
                            <input type="date" class="form-control" id="date" name="date" value="{{ slot.date.strftime('%Y-%m-%d') }}" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="max_capacity" class="form-label fw-semibold">Max Student Capacity *</label>
                            <input type="number" class="form-control" id="max_capacity" name="max_capacity" min="1" max="100" value="{{ slot.max_capacity }}" required>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="start_time" class="form-label fw-semibold">Start Time *</label>
                            <input type="time" class="form-control" id="start_time" name="start_time" value="{{ slot.start_time.strftime('%H:%M') }}" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="end_time" class="form-label fw-semibold">End Time *</label>
                            <input type="time" class="form-control" id="end_time" name="end_time" value="{{ slot.end_time.strftime('%H:%M') }}" required>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="room_link" class="form-label fw-semibold">Venue / Meeting Link</label>
                        <input type="text" class="form-control" id="room_link" name="room_link" value="{{ slot.room_link or '' }}" placeholder="e.g. Google Meet URL or Room 302">
                    </div>

                    <div class="d-flex justify-content-between">
                        <a href="{{ url_for('examiner_slots') }}" class="btn btn-outline-secondary">Cancel</a>
                        <button type="submit" class="btn btn-success">Update Slot</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
