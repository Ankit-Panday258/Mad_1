{% extends 'base.html' %}

{% block title %}{{ action }} Course - Admin{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-7">
        <div class="card border-0 shadow-sm">
            <div class="card-header bg-primary text-white py-3">
                <h5 class="mb-0 fw-bold"><i class="bi bi-journal-plus me-2"></i>{{ action }} Course</h5>
            </div>
            <div class="card-body p-4">
                <form method="POST">
                    <div class="mb-3">
                        <label for="course_code" class="form-label fw-semibold">Course Code *</label>
                        <input type="text" class="form-control text-uppercase" id="course_code" name="course_code" 
                               value="{{ course.course_code if course else '' }}" required placeholder="e.g. CS101">
                        <div class="form-text">Unique code identifying the course.</div>
                    </div>

                    <div class="mb-3">
                        <label for="course_name" class="form-label fw-semibold">Course Name *</label>
                        <input type="text" class="form-control" id="course_name" name="course_name" 
                               value="{{ course.course_name if course else '' }}" required placeholder="e.g. Modern Application Development 1">
                    </div>

                    <div class="mb-3">
                        <label for="description" class="form-label fw-semibold">Course Description</label>
                        <textarea class="form-control" id="description" name="description" rows="3" placeholder="Brief outline of syllabus or course contents">{{ course.description if course else '' }}</textarea>
                    </div>

                    <div class="mb-4">
                        <label for="status" class="form-label fw-semibold">Status</label>
                        <select class="form-select" id="status" name="status">
                            <option value="Active" {% if course and course.status == 'Active' %}selected{% endif %}>Active</option>
                            <option value="Inactive" {% if course and course.status == 'Inactive' %}selected{% endif %}>Inactive</option>
                        </select>
                    </div>

                    <div class="d-flex justify-content-between">
                        <a href="{{ url_for('admin_courses') }}" class="btn btn-outline-secondary">Cancel</a>
                        <button type="submit" class="btn btn-primary"><i class="bi bi-check-circle me-1"></i> Save Course</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
